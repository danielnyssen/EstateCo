<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EstateCo Quote Form</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;margin:0;padding:40px}
.container{max-width:700px;margin:auto;background:#fff;padding:30px;border-radius:10px}
input,textarea,select{width:100%;padding:10px;margin-top:8px;margin-bottom:16px;border:1px solid #ccc;border-radius:6px}
button{background:#1A3C5E;color:#fff;border:none;padding:14px 18px;border-radius:6px;font-size:16px;cursor:pointer}
button:hover{background:#2b567f}
</style>
</head>

<body>

<div class="container">
<h2>Request a Quote</h2>

<form id="quoteForm">
<input name="name" placeholder="Full name" required>
<input name="email" placeholder="Email" required>
<input name="phone" placeholder="Phone">
<input name="suburb" placeholder="Suburb">
<select name="propertyType">
<option value="">Property Type</option>
<option>House</option>
<option>Unit</option>
<option>Apartment</option>
</select>

<select name="size">
<option value="">Property Size</option>
<option>1-2 bedrooms</option>
<option>3 bedrooms</option>
<option>4+ bedrooms</option>
</select>

<textarea name="notes" placeholder="Notes"></textarea>

<label>Attach photos (max 10 files, 10MB each)</label>
<input type="file" id="files" multiple>

<button type="submit">Submit Quote Request</button>
</form>

<p id="status"></p>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMIUAdnHVf1JLIAe_b-EbKDLmRycanQeRl_k-L73wh8gWHN7Kzdl1LLiuJOGxy3HYL/exec";

document.getElementById("quoteForm").addEventListener("submit", async function(e){

e.preventDefault();
const form = e.target;
const status = document.getElementById("status");

let payload = {
reference: "EC-" + Date.now(),
name: form.name.value,
email: form.email.value,
phone: form.phone.value,
suburb: form.suburb.value,
propertyType: form.propertyType.value,
size: form.size.value,
notes: form.notes.value,
files: []
};

const fileInput = document.getElementById("files");

for(const file of fileInput.files){

if(file.size > 10 * 1024 * 1024){
alert("File too large: " + file.name);
continue;
}

const base64 = await new Promise((resolve,reject)=>{
const reader = new FileReader();
reader.onload = ()=>resolve(reader.result.split(",")[1]);
reader.onerror = reject;
reader.readAsDataURL(file);
});

payload.files.push({
name:file.name,
type:file.type,
data:base64
});

}

status.innerText = "Submitting...";

try{

const response = await fetch(SCRIPT_URL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(payload)
});

const result = await response.json();

if(result.result === "success"){
status.innerText = "Thank you. Your enquiry was sent.";
form.reset();
}else{
status.innerText = "There was a problem submitting the form.";
}

}catch(err){

status.innerText = "Submission failed. Please try again.";

}

});

</script>

</body>
</html>
